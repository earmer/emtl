[build-system]
requires = [
    "setuptools>=77",
    "setuptools_scm>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "emtl"
dynamic = ["version"]
description = "东方财富自动交易接口"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Riiy", email = "riiyzhou@gmail.com" },
]
keywords = [
    "autotrade",
    "trade",
    "东方财富",
    "股票",
    "交易",
    "交易机器人",
]
classifiers = [
    # complete classifier list: http://pypi.python.org/pypi?%3Aaction=list_classifiers
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Utilities",
]
dependencies = [
    "cryptography>=43.0.0",
    "ddddocr>=1.6.1",
    "requests>=2.32.0",
]

[project.urls]
Documentation = "https://emtl.readthedocs.io/"
Changelog = "https://emtl.readthedocs.io/en/latest/changelog.html"
"Issue Tracker" = "https://github.com/riiy/emtl/issues"

[project.scripts]
emt = "emtl.cli:run"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]
docs = [
    "sphinx>=7.2,<9",
]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
local_scheme = "dirty-tag"
fallback_version = "0.2.6"

[tool.ruff]
line-length = 140
src = ["src"]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"ci/*" = ["S"]
"src/emtl/tests/*" = ["S105", "S106", "S107"]

[tool.ruff.lint]
ignore = [
    "RUF001", # ruff-specific rules ambiguous-unicode-character-string
    "S101", # flake8-bandit assert
    "S308", # flake8-bandit suspicious-mark-safe-usage
    "S603", # flake8-bandit subprocess-without-shell-equals-true
    "S607", # flake8-bandit start-process-with-partial-path
    "E501", # pycodestyle line-too-long
]
select = [
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "E", # pycodestyle errors
    "EXE", # flake8-executable
    "F", # pyflakes
    "I", # isort
    "INT", # flake8-gettext
    "PIE", # flake8-pie
    "PLC", # pylint convention
    "PLE", # pylint errors
    "PT", # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "RUF", # ruff-specific rules
    "S", # flake8-bandit
    "UP", # pyupgrade
    "W", # pycodestyle warnings
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
forced-separate = ["conftest"]
force-single-line = true

[tool.black]
line-length = 140
target-version = ["py311"]
