version: 2
updates:
  # Keep the runtime/dev dependencies in pyproject.toml and uv.lock current.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  # Keep the GitHub Actions used by the workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
