name: build
on:
  push:
    branches:
    - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'py311'
            python: '3.11'
          - name: 'py312'
            python: '3.12'
          - name: 'py313'
            python: '3.13'
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true
    - name: Install the project
      run: uv sync --python ${{ matrix.python }} --locked
    - name: Run tests
      run: >
        uv run --no-sync pytest
        --cov --cov-report=term-missing --cov-report=xml -vv
    - name: Upload coverage to Codecov
      if: matrix.python == '3.12'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
  lint:
    name: 'lint'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true
    - name: Install the project
      run: uv sync --locked
    - name: ruff
      run: uv run --no-sync ruff check --output-format=github
    - name: black
      run: uv run --no-sync black --check --diff .
    - name: pre-commit
      run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure
  docs:
    name: 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true
    - name: Install the project
      run: uv sync --group docs --locked
    - name: Build the documentation
      run: uv run --no-sync sphinx-build -E -W -b html docs dist/docs
